name: 3D report
description: Tell others how a game works in 3D with Geo Gaming Hub or Flato3D
title: "[3D] "
labels: ["community", "report"]
body:
  - type: markdown
    attributes:
      value: |
        The app's **[Report 3D...]** button fills in the game, the PCGamingWiki link, the method and the setup. Pick the result and submit. The engine and graphics API are read from the PCGamingWiki page, the same way as the app's candidate list, and the report shows in the [community list](https://github.com/nautymac/GeoGamingHub/blob/main/COMMUNITY.md) within a minute or two. (한국어 양식: 3D 동작 보고)
  - type: input
    id: game
    attributes:
      label: Game
      description: Steam name if possible
    validations:
      required: true
  - type: input
    id: pcgw
    attributes:
      label: PCGamingWiki link
      description: "Copy the game's page address from pcgamingwiki.com (a Steam store link works too)"
      placeholder: https://www.pcgamingwiki.com/wiki/Quake_II_RTX
    validations:
      required: true
  - type: dropdown
    id: program
    attributes:
      label: Program
      options:
        - Geo Gaming Hub (geo-11, OGL3D, VK3D, DX12_3D, TriDef 3D)
        - Flato3D (flat 2D games)
      default: 0
    validations:
      required: true
  - type: input
    id: used
    attributes:
      label: 3D method used
      description: "Filled in by the app, e.g. geo-11 Unity, geo-11 UE4, geo-11 DX11, DX9 dgVoodoo, OGL3D, VK3D, VK3D + DXVK, DX12_3D, TriDef 3D, Flato3D"
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works well
        - Works with issues
        - Does not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Setup
      description: Filled in by the app. Without it, write 32/64-bit and versions.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Settings that worked, known problems, GPU, display.
