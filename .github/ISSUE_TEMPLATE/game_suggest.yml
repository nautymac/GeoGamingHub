name: Suggest a game
description: Add a game you have not tried yet to the candidate list
title: "[Candidate] "
labels: ["community", "suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Only the PCGamingWiki link is needed: the engine, graphics API and the 3D method are read from that page, the same way as the app's candidate list. Tried it already? Use the 3D report form instead. (한국어 양식: 후보 제안)
  - type: input
    id: game
    attributes:
      label: Game
      description: Steam name if possible
    validations:
      required: true
  - type: input
    id: pcgw
    attributes:
      label: PCGamingWiki link
      description: "Copy the game's page address from pcgamingwiki.com (a Steam store link works too)"
      placeholder: https://www.pcgamingwiki.com/wiki/Quake_II_RTX
    validations:
      required: true
  - type: dropdown
    id: program
    attributes:
      label: Program
      description: Flat 2D games (pixel art, hand-drawn layers) belong to Flato3D
      options:
        - Geo Gaming Hub (geo-11, OGL3D, VK3D)
        - Flato3D (flat 2D games)
        - Not sure
      default: 2
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Why it looks promising, links to existing fixes, anything else.
